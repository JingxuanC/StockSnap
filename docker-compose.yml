services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksnap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stocksnap
      POSTGRES_USER: stocksnap
      POSTGRES_PASSWORD: stocksnap123
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksnap -d stocksnap"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stocksnap-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksnap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://stocksnap:stocksnap123@postgres:5432/stocksnap
      - REDIS_URL=redis://redis:6379/0
      - TZ=Asia/Shanghai

volumes:
  postgres_data:
    driver: local
